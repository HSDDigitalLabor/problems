<script>
(function () {
    var q = window._cpQueue || [];
    delete window._cpQueue;

    function showError(feedbackId) {
        var el = document.getElementById(feedbackId);
        if (!el) return;
        el.classList.remove('d-none');
        setTimeout(function () { el.classList.add('d-none'); }, 2500);
    }

    function copyText(buttonId, codeId, feedbackId) {
        var btn = document.getElementById(buttonId);
        var codeEl = document.getElementById(codeId);
        if (!btn || !codeEl) return;
        var text = codeEl.textContent.trim();
        btn.disabled = true;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(function () { showError(feedbackId); });
            setTimeout(function () { btn.disabled = false; }, 500);
            return;
        }
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (e) { showError(feedbackId); }
        document.body.removeChild(ta);
        setTimeout(function () { btn.disabled = false; }, 1000);
    }

    for (var i = 0; i < q.length; i++) {
        (function (btnId, codeId, fbId) {
            var btn = document.getElementById(btnId);
            if (!btn) return;
            btn.addEventListener('click', function () { copyText(btnId, codeId, fbId); });
        })(q[i][0], q[i][1], q[i][2]);
    }
})();
</script>
